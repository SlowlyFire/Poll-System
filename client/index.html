<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- An inline SVG favicon as a data URL. Without any favicon the browser requests
         /favicon.ico on every page load and logs a 404 in the console — harmless, but
         it is noise in the one place you look when something is actually wrong.
         Inline means no extra file and no second network request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6df6'/%3E%3Crect x='7' y='18' width='4.5' height='8' rx='1.5' fill='white'/%3E%3Crect x='14' y='11' width='4.5' height='15' rx='1.5' fill='white'/%3E%3Crect x='21' y='6' width='4.5' height='20' rx='1.5' fill='white'/%3E%3C/svg%3E"
    />
    <title>Poll System</title>
  </head>
  <body>
    <!-- React mounts the entire app into this one empty div. -->
    <div id="root"></div>
    <!-- Vite reads this script tag as the entry point and bundles from here. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
